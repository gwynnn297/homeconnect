## ========================================
## Local profile (H2 in-memory) - dùng để chạy nhanh Swagger/FE test
## ========================================
server.port=8080
server.servlet.context-path=/api

# H2 in-memory (MODE=MySQL để tương thích schema cơ bản)
spring.datasource.url=jdbc:h2:mem:homeconnect;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tắt Flyway cho local H2 (vì scripts đang là MySQL)
spring.flyway.enabled=false

# H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console



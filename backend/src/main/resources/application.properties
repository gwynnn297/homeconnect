# ========================================
# Tên ứng dụng
# ========================================
spring.application.name=HomeConnect Core API

# ========================================
# ========================================
# Cấu hình Database MySQL
# ========================================
# URL kết nối MySQL (sử dụng environment variables)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:homeconnect}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# Tên đăng nhập MySQL (environment variable hoặc mặc định)
spring.datasource.username=${DB_USERNAME:root}
# Mật khẩu MySQL (environment variable - BẮT BUỘC phải setup)
spring.datasource.password=${DB_PASSWORD}
# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# Cấu hình JPA & Hibernate
# ========================================
# Hiển thị câu lệnh SQL ra console
spring.jpa.show-sql=true
# Format SQL cho dễ đọc
spring.jpa.properties.hibernate.format_sql=true
# Kiểu database sử dụng
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Để Flyway quản lý hoàn toàn schema (không validate ngay lập tức)
spring.jpa.hibernate.ddl-auto=none

# ========================================
# Cấu hình Flyway Migration
# ========================================
# Bật Flyway
spring.flyway.enabled=true
# Vị trí file migration (mặc định: db/migration)
spring.flyway.locations=classpath:db/migration
# Tự động tạo bảng flyway_schema_history nếu chưa có
spring.flyway.baseline-on-migrate=true
# Encoding cho file SQL
spring.flyway.encoding=UTF-8
# Debug Flyway
logging.level.org.flywaydb=DEBUG

# ========================================
# Cấu hình Email SMTP Gmail
# ========================================
# Email và mật khẩu được hardcode trực tiếp trong file này
# Thay thế YOUR_EMAIL@gmail.com và YOUR_APP_PASSWORD bằng giá trị thực tế của bạn
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========================================
# Cấu hình Server
# ========================================
# Port chạy backend (mặc định 8080)
server.port=8080
# Đường dẫn base API (comment để test)
# server.servlet.context-path=/api

# Ép buộc sử dụng UTF-8 cho toàn bộ request/response
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ========================================
# Cấu hình Logging
# ========================================
# Log level cho package của mình
logging.level.com.homeconnect.core=DEBUG
# Log level cho Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# Cấu hình JWT
# ========================================
# JWT Secret key (nên dùng environment variable trong production)
app.jwt.secret=${JWT_SECRET:homeconnect-secret-key-super-secure-2026-capstone-project-change-this-in-production}
# JWT expiration time (24 hours = 86400000 ms)
app.jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh token expiration (7 days = 604800000 ms)
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ========================================
# Cấu hình Swagger/OpenAPI
# ========================================
# Enable Swagger UI và API Docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Đường dẫn Swagger UI (default path)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Swagger UI configuration
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ========================================
# Cấu hình Wallet & Payment (VietQR)
# ========================================
# Thông tin ngân hàng nhận tiền nạp
# MB = MBBank, VCB = Vietcombank, TCB = Techcombank, etc.
wallet.bank.code=${WALLET_BANK_CODE:MB}
# Số tài khoản ngân hàng nhận tiền
wallet.bank.account=${WALLET_BANK_ACCOUNT:0533356399999}
# Tên chủ tài khoản (để hiển thị trên QR)
wallet.bank.name=${WALLET_BANK_NAME:HOÀNG NGỌC PHÚC}
# Tỷ lệ hoa hồng sàn (15% = 0.15)
wallet.commission.rate=${WALLET_COMMISSION_RATE:0.15}
# Thời gian chờ sau check-out để release salary (giờ)
wallet.salary.release.delay.hours=${WALLET_SALARY_RELEASE_DELAY_HOURS:0}
springdoc.swagger-ui.displayRequestDuration=true
# Expose OpenAPI endpoints
springdoc.show-actuator=true
# Default URL for swagger-ui  
springdoc.swagger-ui.disable-swagger-default-url=false

# ========================================
# Profile mặc định (local với H2)
# ========================================
spring.profiles.default=local

# ========================================
# Cấu hình Geocoding (Goong Maps API)
# ========================================
app.goong.api-key=XsFskN1LmIfYQ3lj94Eltor6ZZNiTFtiAk9xE6g6
app.goong.geocoding-url=https://rsapi.goong.io/Geocode
app.goong.place-detail-url=https://rsapi.goong.io/Place/Detail

# ========================================
# Cấu hình Resilience4j RateLimiter
# ========================================
resilience4j.ratelimiter.instances.goong.limit-for-period=5
resilience4j.ratelimiter.instances.goong.limit-refresh-period=1s
resilience4j.ratelimiter.instances.goong.timeout-duration=10s

# HomeConnect — one-command deploy: docker compose up -d --build
# Copy .env.example to .env and fill values before first run.

name: homeconnect

services:
  db:
    image: mysql:8.4
    container_name: homeconnect-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-homeconnect}
      # Use HC_* names — Windows often defines DB_USERNAME=root and overrides .env in Compose substitution
      MYSQL_USER: ${HC_MYSQL_USER:-homeconnect}
      MYSQL_PASSWORD: ${HC_MYSQL_PASSWORD:?set HC_MYSQL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - db_data:/var/lib/mysql
    # Localhost-only on the host — use with SSH tunnel for MySQL Workbench (never 0.0.0.0 on VPS).
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: homeconnect-ai
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeconnect-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # Database — host MUST be service name "db", not localhost
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      DB_NAME: ${DB_NAME:-homeconnect}
      DB_USERNAME: ${HC_MYSQL_USER:-homeconnect}
      DB_PASSWORD: ${HC_MYSQL_PASSWORD:?set HC_MYSQL_PASSWORD in .env}

      # Socket.IO (nginx proxies /socket.io/ to this port)
      SOCKET_SERVER_HOST: 0.0.0.0
      SOCKET_SERVER_PORT: "9092"

      # Security
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # Email OTP (Gmail SMTP — read by SmtpMailProperties, not spring.mail.*)
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}

      # AI parser (Docker network hostname)
      AI_PARSER_URL: http://ai:8000/api/v1/chat/parse

      # Maps & KYC
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      FACEPP_API_KEY: ${FACEPP_API_KEY:-}
      FACEPP_API_SECRET: ${FACEPP_API_SECRET:-}
      FACEPP_COMPARE_URL: ${FACEPP_COMPARE_URL:-https://api-us.faceplusplus.com/facepp/v3/compare}
      FACEPP_MIN_CONFIDENCE: ${FACEPP_MIN_CONFIDENCE:-80}
      KYC_FACE_MATCH_THRESHOLD: ${KYC_FACE_MATCH_THRESHOLD:-70}
      FPT_AI_API_KEY: ${FPT_AI_API_KEY:-}
      FPT_AI_OCR_URL: ${FPT_AI_OCR_URL:-https://api.fpt.ai/vision/idr/vnm}

      # Wallet / payout
      WALLET_BANK_CODE: ${WALLET_BANK_CODE:-BIDV}
      WALLET_BANK_ACCOUNT: ${WALLET_BANK_ACCOUNT:-}
      WALLET_BANK_NAME: ${WALLET_BANK_NAME:-}
      WALLET_COMMISSION_RATE: ${WALLET_COMMISSION_RATE:-0.15}
      XGATE_API_KEY: ${XGATE_API_KEY:-}
      XGATE_API_URL: ${XGATE_API_URL:-https://api.xgate.vn/v1}
      XGATE_WEBHOOK_SECRET: ${XGATE_WEBHOOK_SECRET:-}

      SERVER_PORT: "8080"
    expose:
      - "8080"
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/swagger-ui.html >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_GOONG_JS_KEY: ${VITE_GOONG_JS_KEY:-}
        VITE_GOONG_REST_API_KEY: ${VITE_GOONG_REST_API_KEY:-}
        VITE_GOONG_MAPTILES_KEY: ${VITE_GOONG_MAPTILES_KEY:-}
        VITE_GOONG_API_KEY: ${VITE_GOONG_API_KEY:-}
    container_name: homeconnect-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db_data:

services:
  db:
    image: mysql:8.4
    container_name: homeconnect-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${DB_NAME:-homeconnect}
      MYSQL_USER: ${DB_USERNAME:-homeconnect}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set in .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: homeconnect-ai
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeconnect-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ${DB_NAME:-homeconnect}
      DB_USERNAME: ${DB_USERNAME:-homeconnect}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}

      # Email OTP (set either EMAIL_* or GMAIL_*)
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}

      # Third-party integrations (optional, but required for related features)
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      FACEPP_API_KEY: ${FACEPP_API_KEY:-}
      FACEPP_API_SECRET: ${FACEPP_API_SECRET:-}
      FACEPP_COMPARE_URL: ${FACEPP_COMPARE_URL:-}
      FACEPP_MIN_CONFIDENCE: ${FACEPP_MIN_CONFIDENCE:-}
      FPT_AI_API_KEY: ${FPT_AI_API_KEY:-}
      FPT_AI_OCR_URL: ${FPT_AI_OCR_URL:-}
      XGATE_API_KEY: ${XGATE_API_KEY:-}
      XGATE_API_URL: ${XGATE_API_URL:-}
      XGATE_WEBHOOK_SECRET: ${XGATE_WEBHOOK_SECRET:-}

      JWT_SECRET: ${JWT_SECRET:-change-me}
      AI_PARSER_URL: http://ai:8000/api/v1/chat/parse
      SOCKET_SERVER_HOST: 0.0.0.0
      SOCKET_SERVER_PORT: 9092
      SERVER_PORT: 8080
    expose:
      - "8080"
      - "9092"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_BASE_URL:-http://localhost}
        VITE_SOCKET_URL: ${PUBLIC_BASE_URL:-http://localhost}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_GOONG_JS_KEY: ${VITE_GOONG_JS_KEY:-}
        VITE_GOONG_REST_API_KEY: ${VITE_GOONG_REST_API_KEY:-}
        VITE_GOONG_MAPTILES_KEY: ${VITE_GOONG_MAPTILES_KEY:-}
        VITE_GOONG_API_KEY: ${VITE_GOONG_API_KEY:-}
    container_name: homeconnect-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
